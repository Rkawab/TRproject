{% extends "base.html" %}
{% load widget_tweaks %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mt-3 mb-3">
    <h2>{{ title }}</h2>
    <a href="{% url 'trips:detail' trip.pk %}" class="btn btn-outline-secondary btn-sm">← 詳細へ戻る</a>
</div>
<p class="text-muted small">旅行: <strong>{{ trip.name }}</strong></p>

<form method="POST">
    {% csrf_token %}
    <div class="card mb-3 shadow-sm">
        <div class="card-header fw-bold">🗺️ 旅行計画</div>
        <div class="card-body">
            {% render_field form.md_plan %}
            <div class="form-text">Markdown形式で旅行計画を自由に記録できます。</div>
        </div>
    </div>

    <div class="d-flex gap-2 mb-4">
        <button type="submit" class="btn btn-primary px-4">保存</button>
        <a href="{% url 'trips:detail' trip.pk %}" class="btn btn-outline-secondary">キャンセル</a>
    </div>
</form>
{% endblock %}
